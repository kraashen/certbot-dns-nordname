name: Base

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: Install dependencies
      run: |
        pip install -e ".[dev]"

    - name: Run lint
      run: |
        python -m pylint certbot_dns_nordname
    
    - name: Run tests
      run: |
        python -m pytest -q
